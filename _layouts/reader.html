---
layout: null
---
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ page.title }} – Reader View</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 700px;
      margin: 2em auto;
      line-height: 1.6;
      color: #222;
      background: #fff;
      padding: 0 1em;
    }
    h1,h2,h3,h4 { margin-top: 1.2em; }
    a { color: #006; text-decoration: underline; }
    #readAloudControls { margin: 1em 0; }
  </style>
</head>
<body>

  <!-- Back to normal view -->
  <p style="text-align:right;">
    <a href="{{ page.url | remove: '/reader/' }}"
       style="background:#0073e6;color:#fff;padding:8px 12px;
              border-radius:4px;text-decoration:none;">
      ← Back to Normal View
    </a>
  </p>

  <!-- Google Translate widget -->
  <div class="translate-container" style="text-align:right; margin-bottom:1em;">
    {% include google_translate.html %}
  </div>

  <!-- Voice picker -->
  <div id="voicePickerContainer" style="margin:1em 0;">
    <label for="voiceSelect" style="font-weight:bold;">Voice:</label>
    <select id="voiceSelect"></select>
  </div>

  <!-- Read-Aloud controls -->
  <div id="readAloudContainer">
    {% include readAloudControls.html %}
  </div>

  <!-- Your page’s rendered markdown -->
  <main id="readableContent">
    {{ content }}
  </main>

  <!-- Read-Aloud scripts (no defer!) -->
  <script src="https://code.responsivevoice.org/responsivevoice.js?key=aJFrbqeA"></script>
  <script src="/assets/js/readAloud.js"></script>
</body>
</html>
