<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcasts - Project 2025 Assistant</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
    <script src="/assets/js/share-bluesky-script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="/">
                <img class="logo" src="/assets/images/logo.webp" alt="Project 2025 Assistant">
            </a>
        </div>

        <!-- Hamburger menu for mobile view -->
        <div class="hamburger">&#9776; Menu</div>
        <nav>
            <ul id="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/toc.html">Table of Contents</a></li>
                <li><a href="/about.html">About Us</a></li>
            </ul>
        </nav>

        <!-- Social Media Icons -->
        <div class="share-buttons">
            <a href="https://www.facebook.com/sharer.php?u={{ page.url | absolute_url }}" 
               onclick="gtag('event', 'facebook_share', { 'event_category': 'social_share', 'event_label': 'Facebook Share'});" 
               target="_blank" 
               title="Share to Facebook">
                <img src="/assets/images/share-icons/facebook.webp" alt="Share on Facebook">
            </a>
            <a href="https://bsky.app" 
               target="_blank" 
               onclick="copyBlueskyShare('{{ page.title | escape }}', '{{ page.url | absolute_url | escape }}');" 
               title="Share to Bluesky">
                <img src="/assets/images/share-icons/bluesky.png" alt="Share on Bluesky">
            </a>
            <a href="https://twitter.com/share?url={{ page.url | absolute_url }}&text={{ page.title }}" 
               onclick="gtag('event', 'twitter_share', { 'event_category': 'social_share', 'event_label': 'Twitter Share'});" 
               target="_blank" 
               title="Share to Twitter">
                <img src="/assets/images/share-icons/twittertrans.png" alt="Share on Twitter">
            </a>
            <a href="https://www.linkedin.com/shareArticle?url={{ page.url | absolute_url }}&title={{ page.title }}" 
               onclick="gtag('event', 'linkedin_share', { 'event_category': 'social_share', 'event_label': 'LinkedIn Share'});" 
               target="_blank" 
               title="Share to LinkedIn">
                <img src="/assets/images/share-icons/linkedin.webp" alt="Share on LinkedIn">
            </a>
        </div>
    </header>

    <main>
        <div style="text-align: center; margin: 20px 0;">
            <script async src="https://cse.google.com/cse.js?cx=31f47f78ef92a4137"></script>
            <div class="gcse-search"></div>
        </div>
        
        <h1>Podcasts</h1>
        <ul>
            <li><a href="/podcasts/episode-1.html">Episode 1: The Introduction to Project 2025</a></li>
            <li><a href="/podcasts/episode-2.html">Episode 2: The Threat to LGBTQ+ Rights</a></li>
            <!-- Add more episodes as needed -->
        </ul>
    </main>

    <footer style="display: flex; justify-content: center; align-items: center; background-color: #333; padding: 10px; flex-direction: column;">
        <!-- Bluesky Follow button with icon and text side by side -->
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <a href="https://bsky.app/profile/project2025assistant.org" target="_blank">
                <img src="/assets/images/share-icons/bluesky.png" alt="Follow us on Bluesky" loading="lazy" style="width: 40px; height: auto;">
            </a>
            <span style="color: white; margin-left: 12px; font-size: 20px;">Follow Us on Bluesky!</span>
        </div>
        
        <!-- Twitter Follow button with icon and text side by side -->
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <a href="https://twitter.com/Project2025Asst" target="_blank">
                <img src="/assets/images/share-icons/twitter_bw.webp" alt="Follow us on Twitter" loading="lazy" style="width: 30px; height: auto;">
            </a>
            <span style="color: white; margin-left: 8px; font-size: 16px;">Follow Us on Twitter!</span>
        </div>
         
        <!-- Copyright and privacy policy in the center -->
        <div style="text-align: center; color: white;">
            <p style="margin: 0;">© 2024 Project 2025 Assistant</p>
            <ul style="list-style: none; padding: 0; margin: 0;">
                <li><a href="/privacy-policy.html" style="color: rgb(173, 173, 173); text-decoration: none;">Privacy Policy</a></li>
            </ul>
            <br><br>
        </div>
    </footer>
</body>
</html>
