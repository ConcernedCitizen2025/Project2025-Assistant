<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Under Construction</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f3f3;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #fff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
        }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon4/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon4/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon4/favicon-16x16.png">
    <link rel="manifest" href="/assets/images/favicon4/site.webmanifest">
    <link rel="mask-icon" href="/assets/images/favicon4/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">    
</head>
<body>
    <div class="container">
        <h1>Under Construction</h1>
        <p>Our website is currently under construction. Please check back soon.</p>
    </div>

    <footer style="display: flex; justify-content: center; align-items: center; background-color: #333; padding: 10px; flex-direction: column;">
        <!-- Bluesky Follow button with icon and text side by side -->
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <a href="https://bsky.app/profile/project2025assistant.org" target="_blank">
                <img src="/assets/images/share-icons/bluesky.png" alt="Follow us on Bluesky" loading="lazy" style="width: 40px; height: auto;">
            </a>
            <span style="color: white; margin-left: 12px; font-size: 20px;">Follow Us on Bluesky!</span>
        </div>
        
        <!-- Twitter Follow button with icon and text side by side -->
        <div style="display: flex; align-items: center; margin-bottom: 10px;">
            <a href="https://twitter.com/Project2025Asst" target="_blank">
                <img src="/assets/images/share-icons/twitter_bw.webp" alt="Follow us on Twitter" loading="lazy" style="width: 30px; height: auto;">
            </a>
            <span style="color: white; margin-left: 8px; font-size: 16px;">Follow Us on Twitter!</span>
        </div>
        
        <!-- Contact section -->
        <div style="color: white; margin-bottom: 10px;">
            <a href="mailto:contact@project2025assistant.org" style="color: #4da6ff; text-decoration: underline; margin-right: 10px;">Contact Us:</a>
            
            <span id="copy-email" 
                onclick="copyEmail()" 
                style="cursor: pointer; color: rgb(173, 173, 173); text-decoration: underline; user-select: none;">
                contact@project2025assistant.org
            </span>
            <span id="copy-msg" style="margin-left: 8px; color: lightgreen; display: none;">Copied!</span>
        </div>


        <!-- Copyright and privacy policy in the center -->
        <div style="text-align: center; color: white;">
            <p style="margin: 0;">© 2024 Project 2025 Assistant</p>
            <ul style="list-style: none; padding: 0; margin: 0;">
                <li><a href="/privacy-policy.html" style="color: rgb(173, 173, 173); text-decoration: none;">Privacy Policy</a></li>
            </ul>
            <br><br>
        </div>
        <!--Goes in Footer-Credit for Text to Speech-->
        <div><a href="https://responsivevoice.org">ResponsiveVoice-NonCommercial</a> licensed under <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/"><img title="ResponsiveVoice Text To Speech" src="https://responsivevoice.org/wp-content/uploads/2014/08/95x15.png" alt="95x15" width="95" height="15" /></a></div>
    </footer>
    <script>
    function copyEmail() {
        const email = "contact@project2025assistant.org";
        navigator.clipboard.writeText(email).then(() => {
            const msg = document.getElementById("copy-msg");
            msg.style.display = "inline";
            setTimeout(() => msg.style.display = "none", 1500);
        });
    }
    </script>


</body>
</html>
