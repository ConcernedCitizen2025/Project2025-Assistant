title: "Project 2025 Assistant"
description: "A comprehensive guide to Project 2025."
baseurl: ""          # Leave this blank since you're using a custom domain
url: "https://project2025assistant.org"  # Your live URL
author: "Benjamin Parsons"
timezone: "America/Los_Angeles"  # ← Add this line here

collections:
  organizations:
    output: true
    permalink: /organizations/:name
  editors:
    output: true
  sections:
    output: true
  authors:
    output: true
  contributors:
    output: true
  categories:
    output: true
  questions:
    output: true
  podcasts:
    output: true

defaults:
  - scope:
      path: ""
      type: organizations
    values:
      layout: organization
  - scope:
      path: ""
      type: authors
    values:
      layout: author
  - scope:
      path: ""
      type: contributors
    values:
      layout: contributor
  - scope:
      path: ""
      type: editors
    values:
      layout: editor
  - scope:
      path: ""
      type: sections
    values:
      layout: project2025_section
  - scope:
      path: ""
      type: categories
    values:
      layout: category
  - scope:
      path: ""
      type: questions
    values:
      layout: question
  - scope:
      path: ""
    values:
      layout: default

theme: minima
markdown: kramdown

# Important Jekyll configuration to ensure your JSON data files get copied
include:
  - _includes
  - assets/images/favicon4/site.webmanifest
  - assets/data   # includes mobilize_protests.json and any other JSON in that folder
  - assets/data/merged_events.json
  - assets/data/virtual_events.json
  - assets/data/events_meta.json