name: 🗓️ Auto-Update Protests & Deploy

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq (used below)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - run: npm ci

      - name: Fetch Mobilizon data
        run: npm run fetch:mobilizon

      - name: Fetch Mobilize data
        # If your npm script uses Puppeteer, you can also do:
        # run: node fetch_mobilize_protests.js
        run: npm run fetch:protests

      - name: Merge & split geo/virtual
        run: node merge_events.js

      - name: Write map-metadata file (safe)
        run: |
          # Pull values from the merge reports written by merge_events.js
          CUTOFF=$(jq -r '.cutoffStr // .cutoff' assets/data/discard_report.json)
          LOOKBACK=$(jq -r '.lookbackDays // 30'   assets/data/discard_report.json)
          # Fallbacks if format ever changes
          if [ -z "$CUTOFF" ] || [ "$CUTOFF" = "null" ]; then
            CUTOFF=$(jq -r '.cutoffStr // .cutoff' assets/data/merge_debug.json)
          fi
          if [ -z "$LOOKBACK" ] || [ "$LOOKBACK" = "null" ]; then
            LOOKBACK=$(jq -r '.lookbackDays // 30' assets/data/merge_debug.json)
          fi
          LAST=$(TZ="America/Los_Angeles" date '+%B %-d, %Y at %-I:%M %p PT')
          cat > assets/data/events_meta.json <<EOF
          {
            "lastUpdated": "$LAST",
            "lookbackDays": ${LOOKBACK:-30},
            "cutoff": "${CUTOFF:-$(date -u '+%Y-%m-%d')}",
            "cutoffStr": "${CUTOFF:-$(date -u '+%Y-%m-%d')}"
          }
          EOF
          echo "events_meta.json →"
          cat assets/data/events_meta.json

      - name: Commit updated events_meta.json back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/events_meta.json
          git commit -m "📅 Auto-update: map metadata" || echo "No changes to commit"
          git push origin main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.8'

      - run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Debug built data
        run: |
          echo "Geo events: $(jq '.data|length' _site/assets/data/merged_events.json)"
          echo "Virtual events: $(jq '.data|length' _site/assets/data/virtual_events.json)"
          echo "Meta:"
          cat _site/assets/data/events_meta.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false
