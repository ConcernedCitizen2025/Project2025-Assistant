name: 🗓️ Auto-Update Protests & Deploy

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci

      # fetch Mobilizon data
      - run: npm run fetch:mobilizon

      # fetch Mobilize data
      - run: npm run fetch:protests

      # *** NEW STEP: merge and geocode everything ***
      - name: Merge & geocode events
        run: node merge_events.js

      # now install Ruby & build
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.8'
      - run: bundle install
      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      # deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: true
