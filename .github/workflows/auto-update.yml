name: 🗓️ Auto-Update Protests & Deploy

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      LOOKBACK_DAYS: "1"              # 🔒 force “yesterday only”
      TZ: America/Los_Angeles         # for timestamps

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq (used below)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - run: npm ci

      - name: Fetch Mobilizon data
        run: npm run fetch:mobilizon

      - name: Fetch Mobilize data
        # If your npm script uses Puppeteer, you can also do:
        # run: node fetch_mobilize_protests.js
        run: npm run fetch:protests

      - name: Merge & split geo/virtual
        run: node merge_events.js   # merge script already reads LOOKBACK_DAYS

      - name: Write map-metadata file (yesterday-only)
        run: |
          CUTOFF=$(jq -r '.cutoffStr // .cutoff' assets/data/discard_report.json)
          LAST=$(date '+%B %-d, %Y at %-I:%M %p PT')
          printf '{"lastUpdated":"%s","lookbackDays":%s,"cutoff":"%s","cutoffStr":"%s"}\n' \
            "$LAST" "$LOOKBACK_DAYS" "$CUTOFF" "$CUTOFF" > assets/data/events_meta.json
          echo "events_meta.json →"
          cat assets/data/events_meta.json

      - name: Commit updated events_meta.json back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/events_meta.json
          git commit -m "📅 Auto-update: map metadata (1-day window)" || echo "No changes to commit"
          git push origin main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.8'

      - run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination _site

      - name: Debug built data
        run: |
          echo "Geo events: $(jq '.data|length' _site/assets/data/merged_events.json)"
          echo "Virtual events: $(jq '.data|length' _site/assets/data/virtual_events.json)"
          echo "Meta:"
          cat _site/assets/data/events_meta.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false
