name: 🗓️ Auto-Update Protests & Deploy

# Run daily at midnight Pacific Time (08:00 UTC)
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:   # also allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out your repo
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0      # needed if you later push commits
          persist-credentials: true

      # 2) Install Node.js & Ruby (for Jekyll)
      - uses: actions/setup-node@v3
        with: { node-version: '18' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.x' }

      # 3) Fetch & install dependencies
      - run: npm ci
      - run: gem install bundler
      - run: bundle install

      # 4) Run your fetch script (this regenerates mobilize_protests.json)
      - run: npm run fetch:protests

      # 5) Build the site
      - run: bundle exec jekyll build --destination _site

      # 6) Deploy the static `_site` directory to GitHub Pages
      #    This uses the official Pages actions; no need to push back to main.
      - uses: actions/configure-pages@v3

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: _site

      - uses: actions/deploy-pages@v2
      
