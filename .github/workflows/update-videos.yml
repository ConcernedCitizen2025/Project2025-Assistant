name: Update Videos Feed

on:
  schedule:
    - cron: '9 8 * * *'   # daily ~08:09 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build videos.json from Google Sheet
        run: |
          node scripts/sheet_to_videos_json.js "$SHEET_CSV_URL"

        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}

      - name: Commit videos.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/videos.json
          git commit -m "Auto-update videos.json from Sheet" || echo "No changes"
          git push
